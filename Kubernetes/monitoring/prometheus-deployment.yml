## Deployment Prometheus di namespace monitoring
# Menjalankan instance Prometheus yang menggunakan ConfigMap untuk konfigurasi
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          # image: image resmi Prometheus
          image: prom/prometheus:latest
          args:
            # --config.file menunjuk ke konfigurasi yang dipasang dari ConfigMap
            - --config.file=/etc/prometheus/prometheus.yml
            # lokasi penyimpanan time-series database (TSDB)
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              # mount ConfigMap ke path yang dibutuhkan Prometheus
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          # emptyDir: storage ephemeral — untuk testing/dev; gunakan PVC untuk production
          emptyDir: {}

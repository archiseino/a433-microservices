## Service untuk Grafana (mengakses UI Grafana pada port 3000 di dalam cluster)
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  # type: NodePort agar Grafana bisa diakses dari luar cluster
  type: NodePort
  selector:
    app: grafana
  ports:
    - protocol: TCP
      # port: port Service di dalam cluster
      port: 3000
      # targetPort: port container Grafana
      targetPort: 3000
      # nodePort: akses dari luar cluster via <NodeIP>:30030
      nodePort: 30030
